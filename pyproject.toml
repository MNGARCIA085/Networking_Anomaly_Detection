[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network_anomaly_detection"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "pandas==2.3.3",
    "numpy==2.2.6",
    "pydantic==2.13.1",
    "scikit-learn==1.7.2",
    "torch>=2.11.0,<2.12.0",
    "lightning>=2.6.6,<2.7.0",
    "joblib==1.5.3",
]

[project.optional-dependencies]
train = [
    "hydra-core==1.3.2",
    "hydra-joblib-launcher==1.2.0",
    "mlflow==3.11.1",
    "optuna==4.8.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]