random_state: 42
experiment_name: network_anomaly_detection
paths:
  root_dir: .
  mlflow_db: mlflow.db
  mlflow_artifacts: mlruns
tracking:
  enabled: true
model_type:
  data:
    train_path: data/servers/X_part2.npy
    val_path: data/servers/X_val_part2.npy
    y_val_path: data/servers/y_val_part2.npy
    test_path: data/servers/X_test.npy
    y_test_path: data/servers/y_test.npy
    windowing:
      enabled: true
      size: 10
      stride: 1
  models:
    n_estimators: 100
    contamination: 0.1
    random_state: 42
  training: {}
  tuning:
    data:
      windowing:
        size:
          choices:
          - 1
          - 5
          - 10
          - 20
    prep:
      scaler:
        names:
        - standard
        - minmax
      feature_selection:
        enabled: true
        names:
        - variance_threshold
        threshold:
          low: 0.0
          high: 0.1
      dimensionality:
        enabled: true
        names:
        - pca
        - truncated_svd
        n_components:
          low: 1
          high: 8
    model_space:
      n_estimators:
        name: n_estimators
        type: int
        low: 50
        high: 300
      contamination:
        name: contamination
        type: float
        low: 0.01
        high: 0.2
  prep:
    pointwise:
      transform:
        enabled: false
        name: log1p
      scaler:
        enabled: false
        name: standard
        params:
          with_mean: true
          with_std: true
      feature_selection:
        enabled: true
        name: variance_threshold
        params:
          threshold: 0.01
      dimensionality:
        enabled: false
        name: pca
        params:
          n_components: 7
          whiten: false
      contamination_filter:
        enabled: false
    windowing:
      size: 5
      stride: 1
  thresholding: {}
  name: isoforest
data:
  train_path: data/servers/X_part2.npy
  val_path: data/servers/X_val_part2.npy
  y_val_path: data/servers/y_val_part2.npy
  test_path: data/servers/X_test.npy
  y_test_path: data/servers/y_test.npy
  windowing:
    enabled: true
    size: 10
    stride: 1
models:
  input_dim: 11
  encoder_dims:
  - 8
  - 4
  decoder_dims:
  - 8
training:
  batch_size: 32
  epochs: 5
  type: default
  optimizer:
    name: adam
    params:
      lr: 0.001
      betas:
      - 0.9
      - 0.999
  loss:
    name: mse
  callbacks:
  - name: print_loss
  - name: early_stopping
    params:
      patience: 5
tuning:
  data:
    windowing:
      size:
        choices:
        - 1
        - 5
        - 10
        - 20
  prep:
    imputation:
      names:
      - simple
      strategy:
        choices:
        - mean
        - median
        - most_frequent
    transform:
      names:
      - power
      params:
        method:
          choices:
          - yeo-johnson
          - box-cox
        standardize:
          choices:
          - true
          - false
    scaler:
      names:
      - standard
      - minmax
  model_space:
    encoder_dims:
    - name: enc1
      type: int
      low: 16
      high: 64
    - name: enc2
      type: int
      low: 4
      high: 32
    decoder_dims:
    - name: dec1
      type: int
      low: 16
      high: 64
  training_space:
    optimizer:
      names:
      - adam
      - sgd
      adam:
        lr:
          low: 0.0001
          high: 0.01
          log: true
        betas:
          choices:
          - - 0.9
            - 0.999
          - - 0.8
            - 0.999
      sgd:
        lr:
          low: 0.001
          high: 0.1
          log: true
        momentum:
          low: 0.0
          high: 0.9
        weight_decay:
          low: 1.0e-06
          high: 0.01
          log: true
    callbacks:
      print_loss: true
      early_stopping:
        enabled: true
        patience:
          low: 3
          high: 10
    epochs:
      name: epochs
      type: int
      low: 5
      high: 20
    batch_size:
      name: batch_size
      type: categorical
      choices:
      - 32
      - 64
  threshdoling:
    name: constrained_f1
    params:
      min_recall: 0.8
thresholding:
  name: constrained_f1
  params:
    min_recall: 0.8
