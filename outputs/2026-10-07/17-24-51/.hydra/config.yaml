random_state: 42
experiment_name: network_anomaly_detection
paths:
  root_dir: .
  mlflow_db: mlflow.db
  mlflow_artifacts: mlruns
tracking:
  enabled: true
model_type:
  data:
    train_path: data/servers/X_part2.npy
    val_path: data/servers/X_val_part2.npy
    y_val_path: data/servers/y_val_part2.npy
    test_path: data/servers/X_test.npy
    y_test_path: data/servers/y_test.npy
    windowing:
      enabled: true
      size: 10
      stride: 1
  models:
    n_estimators: 100
    contamination: 0.1
    max_samples: auto
    max_features: 1.0
    bootstrap: false
    random_state: 42
  training: {}
  tuning:
    data:
      windowing:
        size:
          choices:
          - 1
          - 5
          - 10
          - 20
    prep:
      scaler:
        names:
        - standard
        - minmax
      feature_selection:
        enabled: true
        names:
        - variance_threshold
        threshold:
          low: 0.0
          high: 0.1
      dimensionality:
        enabled: true
        names:
        - pca
        - truncated_svd
        n_components:
          low: 1
          high: 8
    model_space:
      n_estimators:
        name: n_estimators
        type: int
        low: 50
        high: 300
      contamination:
        name: contamination
        type: float
        low: 0.01
        high: 0.2
  prep:
    pointwise:
      scaler:
        enable: true
        name: standard
        params:
          with_mean: true
          with_std: true
      feature_selection:
        enable: false
        name: variance_threshold
        params:
          threshold: 0.01
      dim_reduction:
        enable: true
        name: pca
        params:
          n_components: 4
          whiten: false
      transform:
        enable: false
        name: power
        params:
          method: yeo-johnson
      contamination_filter:
        enabled: false
    windowing:
      size: 5
      stride: 1
  thresholding: {}
  name: isoforest
