

pointwise:

  imputation:
    enabled: true
    name: simple
    params:
      strategy: median

  scaler:
    enable: true
    name: standard
    params:
      with_mean: true
      with_std: true

  feature_selection:
    enabled: false
    name: pca
    params:
      n_components: 0.95

  dim_reduction:
    enable: true
    name: pca
    params:
      n_components: 4
      whiten: false

  transform:
    enable: false
    name: power
    params:
      method: yeo-johnson

  contamination_filter:
    enabled: false



windowing:
  size: 3
  stride: 1



