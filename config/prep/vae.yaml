pointwise:
  imputation:
    enabled: true
    name: simple
    params:
      strategy: median

  feature_selection:
    enabled: false
    name: variance_threshold
    params:
      threshold: 0.0

  scaler:
    enabled: true
    name: standard
    params:
      with_mean: true
      with_std: true


windowing:
  size: 3
  stride: 1


temporal:
  delta:
    enable: false
    name: delta
    params:
      order: 1





