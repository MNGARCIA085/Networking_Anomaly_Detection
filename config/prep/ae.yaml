pointwise:
  imputation:
    enabled: true
    name: simple
    params:
      strategy: median

  feature_selection:
    enabled: false
    name: variance_threshold
    params:
      threshold: 0.0

  scaler:
    enabled: true
    name: standard
    params:
      with_mean: true
      with_std: true

  transform:
    enabled: false
    name: power
    params:
      method: yeo-johnson
      standardize: false


windowing:
  size: 3
  stride: 1


temporal:
  delta:
    enabled: false
    name: delta
    params:
      order: 1

  rolling:
    enabled: false
    name: rolling_stats
    params:
      window: 5

