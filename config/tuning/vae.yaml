random_state: 42

metric: pr_auc
direction: maximize
n_trials: 2
n_jobs: 2

prep:
  pointwise:
    imputation:
      names:
        - simple
      strategy:
        choices:
          - mean
          - median
          - most_frequent

    transform:
      names:
        - power
      params:
        method:
          choices:
            - yeo-johnson
            - box-cox
        standardize:
          choices:
            - true
            - false

    scaler:
      names: [standard, minmax]

  windowing:
    size:
      choices: [1, 3]

model_space:
  encoder_dims:
    choices:
      - [128, 64, 16]
      - [128, 32, 8]
      - [64, 32, 8]
      - [64, 16, 4]

  decoder_dims:
    choices:
      - [16, 64]
      - [8, 32]
      - [8, 32, 64]

  latent_dim:
    choices: [2, 4, 8, 16]

  beta:
    low: 0.01
    high: 2.0
    log: true

training_space:
  optimizer:
    names: [adam, sgd]

    adam:
      lr:
        low: 1e-4
        high: 1e-2
        log: true

      betas:
        choices:
          - [0.9, 0.999]
          - [0.8, 0.999]

    sgd:
      lr:
        low: 1e-3
        high: 1e-1
        log: true

      momentum:
        low: 0.0
        high: 0.9

      weight_decay:
        low: 1e-6
        high: 1e-2
        log: true

  callbacks:
    print_loss: true

    early_stopping:
      enabled: true
      patience:
        low: 3
        high: 10

  epochs:
    name: epochs
    type: int
    low: 1
    high: 3

  batch_size:
    name: batch_size
    type: categorical
    choices: [32, 64]

thresholding:
  name: constrained_f1
  params:
    min_recall: 0.75