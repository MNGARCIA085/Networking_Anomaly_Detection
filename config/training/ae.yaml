batch_size: 32
epochs: 7
type: "default" # or "vae", "transfer"

optimizer:
  name: adam
  params:
    lr: 0.001
    betas: [0.9, 0.999]
    weight_decay: 0.0001


loss:
  name: mse


callbacks:
  - name: print_loss

  - name: early_stopping
    params:
      patience: 15
      monitor: val_loss
      mode: min

  - name: checkpoint
    params:
      every_n_epochs: 10
      keep_last: 2
      save_best: true
      monitor: val_loss
      mode: min

num_workers: 1