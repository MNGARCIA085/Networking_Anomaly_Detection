batch_size: 32
epochs: 2
type: "default" # or "vae", "transfer"

optimizer:
  name: adam
  params:
    lr: 0.001
    betas: [0.9, 0.999]
    weight_decay: 0.0001


loss:
  name: mse



scheduler:
  name: reduce_on_plateau
  monitor: val_loss
  interval: epoch
  frequency: 1
  params:
    mode: min
    factor: 0.5
    patience: 5
    min_lr: 0.000001


callbacks:
  - name: print_loss

  - name: early_stopping
    params:
      patience: 15
      monitor: val_loss
      mode: min

  - name: checkpoint
    params:
      every_n_epochs: 10
      keep_last: 2
      save_best: true
      monitor: val_loss
      mode: min

num_workers: 1